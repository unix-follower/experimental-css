<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG basics</title>
  </head>
  <body>
    <svg width="280" height="280" style="border: 1px solid black">
      <circle cx="200" cy="200" r="50" fill="grey" stroke="red" stroke-width="2" />
    </svg>
    <svg width="420" height="320" style="border: 1px solid black">
      <rect x="300" y="100" width="100" height="200" fill="blue" />
    </svg>
    <svg width="140" height="320" style="border: 1px solid black">
      <line x1="100" y1="100" x2="120" y2="300" stroke="grey" stroke-width="3" />
    </svg>
    <svg width="240" height="250" style="border: 1px solid black">
      <path d="M 150 50 L 75 200 L 225 200 Z" fill="orange" />
    </svg>
    <svg width="240" height="220" style="border: 1px solid black">
      <path d="M 150 50 L 75 200 L 225 200 C 225 200 150 150 150 50 Z" fill="orange" />
      <circle cx="150" cy="150" r="5" fill="grey" />
      <line x1="225" y1="200" x2="150" y2="50" stroke="grey" stroke-width="2" />
      <line x1="225" y1="200" x2="150" y2="150" stroke="grey" stroke-width="2" />
    </svg>
  </body>
</html>
